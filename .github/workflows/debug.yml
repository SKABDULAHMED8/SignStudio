name: SignStudio Debug Diagnostics

on:
  push:
    branches:
      - 'debug/*'
      - 'debug-package-integration'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: signstudio-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan / Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and history for secrets
        run: docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --source=/path --redact --verbose

  diagnostics:
    name: Windows / Node 22 / Playwright Chromium
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run consolidated SignStudio diagnostics
        shell: pwsh
        run: ./scripts/Run-SignStudio-Debug.ps1 -SkipInstall -SkipBrowserInstall
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signstudio-debug-artifacts-${{ github.run_number }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
