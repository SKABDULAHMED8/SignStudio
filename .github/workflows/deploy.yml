name: Deploy SignStudio to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_approval:
        description: Select this only after reviewing and approving the release.
        required: true
        type: choice
        options:
          - Approve-Release

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event.inputs.release_approval == 'Approve-Release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event.inputs.release_approval == 'Approve-Release'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
